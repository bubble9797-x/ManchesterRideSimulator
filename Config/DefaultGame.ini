[/Script/ManchesterRide.MRNetworkSettings]
; Network protocol version sent by clients in the login URL (?ver=). Bump when
; replicated data or RPC signatures change so mismatched builds get a clear error.
ProtocolVersion=1
DefaultPort=7777
DefaultMaxPlayers=8
; Hard ceiling until larger sessions have been tested (see DEVELOPMENT_STATUS.md).
MaxPlayersCeiling=16
; How often the owning client sends its ride state to the server (Hz).
ClientSendRate=30
; Delay used to interpolate other players (seconds). Higher = smoother, more latent.
InterpolationDelay=0.12
AutoReconnectAttempts=3
; The dedicated server (Server/, built by Tools/server/build_server.bat) that Multiplayer joins.
; This is the public address of the Playit.gg UDP tunnel in front of it.
DedicatedServer=209.25.141.16:38420

[/Script/Engine.GameSession]
