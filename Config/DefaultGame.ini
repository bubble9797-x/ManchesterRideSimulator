; packaged game, so its content (and the ion settings asset) must not be cooked for the shipping build.
+DirectoriesToNeverCook=(Path="/CesiumForUnreal")
+DirectoriesToNeverCook=(Path="/Game/CesiumSettings")
IncludePrerequisites=True

