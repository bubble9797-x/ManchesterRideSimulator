[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Shipping
FullRebuild=False
ForDistribution=False
IncludeDebugFiles=False
UsePakFile=True
bUseIoStore=True
bCompressed=True
+MapsToCook=(FilePath="/Engine/Maps/Entry")
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
; Geo pipeline output is plain JSON, shipped alongside the paks.
+DirectoriesToAlwaysStageAsNonUFS=(Path="GeoData")
; Logo for the in-game opening screen (Tools/branding/make_branding.ps1).
+DirectoriesToAlwaysStageAsNonUFS=(Path="Brand")
; Materials and textures are loaded by path from C++, so nothing references them for the cooker.
+DirectoriesToAlwaysCook=(Path="/Game/MR")
+DirectoriesToAlwaysCook=(Path="/Engine/EngineSky/VolumetricClouds")
